[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bss-duet"
version = "0.1.0"
description = "DUET blind source separation (Python)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
only-include = ["bss.py", "find_peaks.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["Data"]
